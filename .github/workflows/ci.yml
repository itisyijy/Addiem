# main 으로 가는 PR과 main push 마다 프론트 빌드 · 타입 검사 · clippy · Rust 테스트를 Windows 에서 돌린다.
# 앱이 Windows 데스크톱(WebView2)이라 러너도 Windows 로 맞춘다. Rust 버전은 rust-toolchain.toml 을 따른다
name: CI

# 스택 PR(main 이 아닌 브랜치로 가는 PR)은 이제 로컬에서 같은 검사를 돌려 확인한다
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      # tauri::generate_context! 가 ../dist 를 읽으므로 cargo 보다 먼저 만든다
      - run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # 8.3 개념 관계 확인 엔진 (보조 실행 파일, 본체와 따로 빌드). 검사만 하고 설치 파일용 AVX2 빌드는 tools/build_llm.ps1.
      # 본체의 target 을 같이 써서 같은 버전의 candle · tokenizers 를 다시 빌드하지 않는다
      - name: cargo clippy (llm 엔진)
        working-directory: src-tauri/llm
        run: cargo clippy --locked --target-dir ../target --all-targets -- -D warnings

      - name: cargo test (llm 엔진)
        working-directory: src-tauri/llm
        run: cargo test --locked --target-dir ../target
