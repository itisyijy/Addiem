[package]
name = "neo-anki"
version = "0.1.0"
description = "시험일까지의 완주 전략을 관리하는 Anki 호환 학습 앱"
authors = ["itisyijy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neo_anki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fsrs = "6.6.2"
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
zstd = "0.14.2"
zip = "9.0.2"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2"
base64 = "0.23.1"
# I · 원자료 (source.rs, embed.rs). PPTX 는 XML 을 직접 읽고, 임베딩은 순수 Rust(candle)로 CPU 에서 돈다
quick-xml = "=0.42.0"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
# 모델 내려받기 전용 HTTPS (사용자가 [내려받기]를 누를 때만). 인증서는 번들(webpki-roots)
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
sha2 = "=0.10.9"
# K · Google Drive 동기화 (sync/). HTTPS 는 위 ureq, 그림 해시는 위 sha2 를 같이 쓴다.
# gzip(변경 묶음) · OS 키체인(토큰) · OAuth 주소 · 난수(PKCE) · 암호로 잠그기(Argon2id + XChaCha20-Poly1305). 모두 순수 Rust
flate2 = "=1.1.10"
keyring = "=4.2.0"
url = "=2.5.8"
getrandom = "=0.4.3"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
# G2 ChatGPT 로그인의 ID 토큰 서명(RS256) 확인. rustls 가 이미 쓰는 같은 버전이라 새로 받는 크레이트는 없다
ring = "=0.17.14"


# 임베딩 행렬곱은 디버그 빌드에서 수십 배 느리다. 개발 중에도 이 크레이트들만 최적화한다
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
